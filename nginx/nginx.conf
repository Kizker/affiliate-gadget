events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression — broad MIME coverage
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Nginx Proxy Cache for Ultra-Fast TTFB on Public Pages
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=NEXT_CACHE:10m max_size=250m inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name affiliategadget.tech www.affiliategadget.tech _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name affiliategadget.tech www.affiliategadget.tech;

        ssl_certificate     /etc/letsencrypt/live/affiliategadget.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/affiliategadget.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 50M;

        # Security headers (Lighthouse Best Practices)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=*" always;

        # Cache bypass rule for non-GET, dynamic routes, and authenticated users
        set $skip_cache 0;
        if ($request_method != GET) {
            set $skip_cache 1;
        }
        if ($request_uri ~* "^/(api|dashboard|auth|checkout|cart)") {
            set $skip_cache 1;
        }
        if ($http_cookie ~* "(authjs\.session-token|next-auth\.session-token)") {
            set $skip_cache 1;
        }

        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_cache NEXT_CACHE;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_valid 200 302 60s;
            proxy_cache_valid 404 1m;
            proxy_ignore_headers Set-Cookie Cache-Control;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js static assets — immutable cache 1 tahun
        location /_next/static/ {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Next.js image optimization endpoint
        location /_next/image {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
            access_log off;
        }

        # Serve uploaded files (avatar, foto produk, review) langsung dari disk VPS
        # Volume: ./public/uploads → /app/public/uploads (mounted read-only di nginx)
        location /uploads/ {
            alias /app/public/uploads/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
            access_log off;
        }

        # Static public images (banner, hero, logos)
        location /images/ {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
            access_log off;
        }

        # WebSocket server for live streaming real-time chat & interactions
        location /ws {
            proxy_pass http://ws-server:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /ws/ {
            proxy_pass http://ws-server:3001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
